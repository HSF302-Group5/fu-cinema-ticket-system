<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Quản lý phòng chiếu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Quản lý phòng chiếu</h3>
            <p class="text-muted mb-0">Danh sách các phòng chiếu và sức chứa trong rạp</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/rooms/new}">
            <i class="bi bi-plus-lg"></i> + Thêm phòng chiếu
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 80px">Mã</th>
                    <th>Tên phòng</th>
                    <th>Loại phòng</th>
                    <th>Quy mô (Hàng × Ghế)</th>
                    <th>Sức chứa</th>
                    <th>Trạng thái</th>
                    <th class="text-end" style="width: 180px">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="7" class="text-center text-muted py-4">Chưa có phòng chiếu nào trong hệ thống.</td>
                </tr>
                <tr th:each="r : ${rooms}">
                    <td class="text-muted" th:text="${r.roomId}"></td>
                    <td><strong th:text="${r.roomName}"></strong></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${r.roomType}"></span>
                    </td>
                    <td th:text="${r.totalRows} + ' hàng × ' + ${r.seatsPerRow} + ' ghế'"></td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${r.capacity} + ' ghế'"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${r.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${r.status.name() == 'ACTIVE'} ? 'HOẠT ĐỘNG' : 'BẢO TRÌ'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary me-1"
                           th:href="@{/admin/rooms/{id}/edit(id=${r.roomId})}">
                            Sửa
                        </a>
                        <form class="d-inline" method="post"
                              th:action="@{/admin/rooms/{id}/delete(id=${r.roomId})}"
                              onsubmit="return confirm('Bạn có chắc muốn xoá phòng này? Nếu phòng đã có suất chiếu, trạng thái sẽ tự động chuyển sang BẢO TRÌ (MAINTENANCE).');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xoá</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
