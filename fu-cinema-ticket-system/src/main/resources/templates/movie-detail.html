<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head(${movie.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Thông tin chi tiết phim -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <img class="img-fluid rounded shadow" th:src="${movie.posterUrl}" th:alt="${movie.title}" style="max-height: 400px; width: 100%; object-fit: cover;">
        </div>
        <div class="col-md-9">
            <h2 class="fw-bold" th:text="${movie.title}"></h2>
            <p class="mt-2">
                <span class="badge bg-danger fs-6" th:text="${movie.ageRating}"></span>
                <span class="badge bg-info text-dark fs-6" th:text="${movie.genre.genreName}"></span>
                <span class="text-muted ms-2" th:text="|${movie.duration} phút · Khởi chiếu: ${#temporals.format(movie.releaseDate, 'dd/MM/yyyy')}|"></span>
            </p>
            <p><strong>Đạo diễn:</strong> <span th:text="${movie.director}"></span></p>
            <p><strong>Mô tả:</strong> <span th:text="${movie.description}"></span></p>
            <p>
                <strong>Đánh giá:</strong>
                <span th:if="${rating != null and rating.total > 0}" class="text-warning fw-bold"
                      th:text="|${#numbers.formatDecimal(rating.average, 1, 1)}/5 ⭐ (${rating.total} lượt đánh giá)|"></span>
                <span th:if="${rating == null or rating.total == 0}" class="text-muted">Chưa có đánh giá nào</span>
            </p>
        </div>
    </div>

    <!-- Lịch chiếu suất tương lai gom nhóm theo ngày -->
    <h4 class="mt-4 border-bottom pb-2">📅 Lịch chiếu</h4>
    <p th:if="${showtimesByDate.isEmpty()}" class="text-muted fst-italic">Hiện tại chưa có suất chiếu sắp tới cho phim này.</p>

    <div th:each="entry : ${showtimesByDate}" class="mb-3">
        <h6 class="fw-bold text-primary" th:text="${#temporals.format(entry.key, 'EEEE, dd/MM/yyyy')}"></h6>
        <div class="d-flex flex-wrap gap-2 mt-2">
            <a th:each="s : ${entry.value}" class="btn btn-outline-success"
               th:href="@{/customer/showtimes/{id}/seats(id=${s.showtimeId})}"
               th:text="|${#temporals.format(s.startTime, 'HH:mm')} · ${s.room.roomName}|">
            </a>
        </div>
    </div>

    <!-- Khu vực đánh giá của khán giả -->
    <h4 class="mt-5 border-bottom pb-2">💬 Đánh giá của khán giả</h4>

    <!-- Form đánh giá chỉ hiện khi khách hàng đã xem phim -->
    <form th:if="${canReview}" th:action="@{/customer/movies/{id}/review(id=${movie.movieId})}"
          th:object="${reviewForm}" method="post" class="card card-body shadow-sm mb-4">
        <h6 class="fw-bold mb-3">Gửi đánh giá của bạn:</h6>
        <div class="row g-2">
            <div class="col-md-2">
                <select class="form-select" th:field="*{rating}">
                    <option value="5">5 ⭐ Tuyệt vời</option>
                    <option value="4">4 ⭐ Rất hay</option>
                    <option value="3">3 ⭐ Bình thường</option>
                    <option value="2">2 ⭐ Tạm được</option>
                    <option value="1">1 ⭐ Rất tệ</option>
                </select>
            </div>
            <div class="col-md-8">
                <input class="form-control" th:field="*{comment}" placeholder="Chia sẻ cảm nghĩ của bạn về bộ phim...">
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-primary" type="submit">Gửi</button>
            </div>
        </div>
    </form>
    <p th:if="${!canReview}" class="small text-muted fst-italic">
        💡 Bạn chỉ có thể đánh giá sau khi đã mua vé và xem xong phim này.
    </p>

    <!-- Danh sách đánh giá -->
    <div th:if="${reviews != null and !reviews.isEmpty()}" class="list-group">
        <div th:each="r : ${reviews}" class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
                <strong th:text="${r.customer.fullName}"></strong>
                <span class="text-warning fw-bold" th:text="|${r.rating} ⭐|"></span>
            </div>
            <p class="mb-1 mt-1 text-secondary" th:text="${r.comment}"></p>
            <small class="text-muted" th:text="${#temporals.format(r.reviewDate, 'dd/MM/yyyy HH:mm')}"></small>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
