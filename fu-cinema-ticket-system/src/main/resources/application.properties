spring.application.name=fu-cinema-ticket-system

# Profile "local" chua thong tin ket noi DB (application-local.properties KHONG commit)
spring.profiles.active=local

# Mac dinh ket noi Microsoft SQL Server (FUCinemaTicketDB) dong bo giua Web va Desktop
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FUCinemaTicketDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true


# Thymeleaf
spring.thymeleaf.cache=false

# Hien thi trang loi tuy bien, khong lo stack trace
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
